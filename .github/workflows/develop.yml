name: Publish image to registry

on:
  push:
    branches:
      - develop

concurrency:
  group: develop

env:
  REGISTRY_URL: ${{ vars.REGISTRY_URL }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  TAG: ${{ github.ref_name }}

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, 'chore: bump version to')"
    name: Publish image to registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push image to registry
        run: |
          # Login to registry
          echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin $REGISTRY_URL

          # Build the image and push it to registry
          docker build -f Dockerfile -t $REGISTRY_URL/$IMAGE_NAME:develop .
          docker push $REGISTRY_URL/$IMAGE_NAME:develop
