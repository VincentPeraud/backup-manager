name: Publish image to registry

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish

env:
  REGISTRY_URL: ${{ vars.REGISTRY_URL }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  TAG: ${{ github.ref_name }}

jobs:
  publish:
    name: Publish image to registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push image to registry
        run: |
          # Login to registry
          echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin $REGISTRY_URL

          # Build the image and push it to registry
          docker build -f Dockerfile -t $REGISTRY_URL/$IMAGE_NAME:$TAG .
          docker push $REGISTRY_URL/$IMAGE_NAME:$TAG
          docker tag $REGISTRY_URL/$IMAGE_NAME:$TAG $REGISTRY_URL/$IMAGE_NAME:latest
          docker push $REGISTRY_URL/$IMAGE_NAME:latest

  publish-description:
    name: Publish image description to registry
    runs-on: ubuntu-latest
    needs: publish
    if: vars.REGISTRY_URL == 'docker.io'
    steps:
      - name: Update Docker Hub repository description
        env:
          README_CONTENT: ${{ github.workspace }}/README.md
        run: |
          echo "Updating Docker Hub description from README.md"
          REPO_PATH="$IMAGE_NAME"
          if ! echo "$REPO_PATH" | grep -q '/'; then
            REPO_PATH="$REGISTRY_USERNAME/$REPO_PATH"
          fi
          BODY=$(jq -n --rawfile desc "$README_CONTENT" '{full_description: $desc}')
          LOGIN_RESPONSE=$(curl -s -X POST https://hub.docker.com/v2/auth/token \
            -H "Content-Type: application/json" \
            -d "{\"identifier\": \"${REGISTRY_USERNAME}\", \"secret\": \"${REGISTRY_PASSWORD}\"}")
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain Docker Hub token"
            echo "$LOGIN_RESPONSE"
            exit 1
          fi
          RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/hub_response.txt \
            -X PATCH \
            https://hub.docker.com/v2/repositories/$REPO_PATH/ \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Docker Hub description updated successfully."
          else
            echo "Failed to update Docker Hub description (status: $RESPONSE)."
            cat /tmp/hub_response.txt
            exit 1
          fi
